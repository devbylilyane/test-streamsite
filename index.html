<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LILYtab | Streaming</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar">
        <a href="#" class="logo">LILY<span>tab</span></a>
        <a href="#" class="btn-signin">Explorer</a>

        <div class="hero-content">
            <h1>L'expérience streaming réinventée.</h1>
            <p>Découvrez votre catalogue de films et séries avec élégance.</p>
            
            <div class="input-group">

                    <input type="password" id="demoPass" placeholder="Mot de passe">
                    <div id="error-message"></div>
                </div>
                <button id="btnStart" class="btn-commencer">Tester le Design</button>
            </div>
        </div>
    </header>

    <script src="script.js"></script>
