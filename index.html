<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Case Study: Redesign UI - Lilyane</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

   <header class="navbar">
        <div class="logo">LILY<span>FLIX</span></div>
        <a href="#" class="btn-signin">Maquette UI/UX</a>
    </header>

    <section class="hero">
        <div class="hero-overlay"></div> 
        <div class="hero-content">
            <h1>L'expérience Streaming, repensée par Lilyane<span>.</span></h1>
            <p>Étude de cas UI/UX : Optimisation du parcours utilisateur.</p>
            
            <div class="email-form">
                <p style="color: #D1317A; font-weight: bold; margin-bottom: 10px;">[ ACCÈS INTERFACE DE TEST ]</p>
                
                <div class="input-group">
                    <div class="inputs-container">
                        <input type="text" id="demoUser" placeholder="Identifiant de démo">
                        <input type="text" id="demoPass" placeholder="Code d'accès (Ex: 123456)">
                    </div>
                    <button class="btn-commencer" id="btnStart">Lancer l'aperçu ></button>
                </div>
                
                <p id="error-message"></p>
            </div>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
